<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#314e36">
  <title>Restaurant staff · 9ja Life</title>
  <style>
    :root{--green:#314e36;--orange:#ed6b35;--cream:#fffaf4;--ink:#22231f;--muted:#77776e;--line:#eee8df}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Arial,sans-serif}main{max-width:950px;margin:30px auto;padding:0 18px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.brand{color:var(--green);font-weight:800;text-decoration:none;font-size:20px}h1{font-size:26px;margin:18px 0 8px}p{color:var(--muted);line-height:1.5}.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px;margin:16px 0}.field{width:100%;padding:11px;border:1px solid var(--line);border-radius:7px;margin:6px 0 14px;font:inherit}.field[type=file]{padding:8px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:block;font-size:13px;font-weight:700}.primary,.secondary{border:0;border-radius:7px;padding:11px 15px;background:var(--green);color:#fff;font-weight:700;cursor:pointer}.secondary{background:#f6efe6;color:var(--green)}button:disabled{opacity:.55;cursor:wait}.hidden{display:none!important}.status{font-size:13px;min-height:20px;color:#a13c28}.status.ok{color:var(--green)}.staff-item{display:grid;grid-template-columns:76px 1fr auto;align-items:center;gap:13px;border-top:1px solid var(--line);padding:13px 0}.staff-item img{width:76px;height:64px;border-radius:7px;object-fit:cover;background:#f2eee8}.staff-item strong{display:block}.staff-item small{display:block;color:var(--muted);margin-top:5px}.actions{display:flex;gap:8px;flex-wrap:wrap}.check{display:flex;align-items:center;gap:8px;margin:0 0 16px}.check input{width:auto;margin:0}.note{font-size:12px}.back{color:var(--green);font-size:13px}@media(max-width:620px){.row{grid-template-columns:1fr}.staff-item{grid-template-columns:58px 1fr}.staff-item img{width:58px;height:58px}.actions{grid-column:1/-1}.card{padding:15px}}
  </style>
</head>
<body>
<main>
  <header><a class="brand" href="./">9ja Life · Staff</a><a class="back" href="./">Back to menu</a></header>
  <section id="loginPanel" class="card">
    <h1>Restaurant menu manager</h1>
    <p>Sign in with a restaurant staff account to add dishes, upload photos, update prices or hide items.</p>
    <form id="loginForm" onsubmit="login(event)">
      <label>Email<input class="field" type="email" id="email" autocomplete="username" required></label>
      <label>Password<input class="field" type="password" id="password" autocomplete="current-password" required></label>
      <button class="primary" type="submit">Sign in</button><p id="loginMessage" class="status" role="status"></p>
    </form>
  </section>

  <section id="adminPanel" class="hidden">
    <div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:12px"><div><h1 style="margin-top:0">Manage menu</h1><p style="margin-bottom:0">Changes appear on the customer menu after they reload the site.</p></div><button class="secondary" onclick="logout()">Sign out</button></div></div>
    <form id="itemForm" class="card" onsubmit="saveItem(event)">
      <h2 id="formTitle" style="font-size:18px;margin-top:0">Add a menu item</h2>
      <div class="row"><label>Food or item name<input class="field" id="itemName" maxlength="100" required></label><label>Price in naira<input class="field" id="itemPrice" type="number" min="1" step="1" required></label></div>
      <div class="row"><label>Category<input class="field" id="itemCategory" list="categoryOptions" maxlength="40" required><datalist id="categoryOptions"><option>Rice</option><option>Mains</option><option>Small chops</option><option>Drinks</option></datalist></label><label>Short label<input class="field" id="itemTag" maxlength="40" placeholder="For example: Customer favourite"></label></div>
      <label>Description<textarea class="field" id="itemDescription" maxlength="240" rows="3"></textarea></label>
      <label>Food photo (JPG, PNG or WebP; max 5 MB)<input class="field" id="itemPhoto" type="file" accept="image/jpeg,image/png,image/webp"></label>
      <label class="check"><input type="checkbox" id="itemActive" checked> Show this item to customers</label>
      <div class="actions"><button class="primary" id="saveButton" type="submit">Save item</button><button class="secondary" type="button" onclick="resetForm()">Clear form</button></div>
      <p id="formMessage" class="status" role="status"></p>
    </form>
    <section class="card"><h2 style="font-size:18px;margin-top:0">Current menu</h2><div id="menuList">Loading menu…</div></section>
  </section>
</main>
<script>
const SB_URL='https://tqkyplmasxrwbjbqgdpc.supabase.co';
const SB_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRxa3lwbG1hc3hyd2JqYnFnZHBjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM2NzMxNDksImV4cCI6MjEwOTI0OTE0OX0.pT06Mjut7_ZIukzpfEQJex859TwKNjQjEl-C2OXpebU';
let accessToken=sessionStorage.getItem('9jaStaffToken')||'',staffUserId=sessionStorage.getItem('9jaStaffUserId')||'',editingSlug='',menuItems=[];
const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function setMessage(id,text,ok=false){const el=document.querySelector('#'+id);el.textContent=text;el.classList.toggle('ok',ok)}
async function request(path,{method='GET',body=null,auth=true}={}){const headers={apikey:SB_ANON_KEY};if(auth&&accessToken)headers.Authorization='Bearer '+accessToken;if(body){headers['Content-Type']='application/json';headers.Prefer='return=representation'}const response=await fetch(SB_URL+path,{method,headers,body:body?JSON.stringify(body):undefined});const data=await response.json().catch(()=>null);if(!response.ok)throw new Error(data?.message||data?.msg||data?.error_description||'Request failed ('+response.status+')');return data}
async function login(event){event.preventDefault();setMessage('loginMessage','Signing in…');try{const response=await fetch(SB_URL+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:SB_ANON_KEY,'Content-Type':'application/json'},body:JSON.stringify({email:document.querySelector('#email').value,password:document.querySelector('#password').value})});const data=await response.json();if(!response.ok)throw new Error(data.msg||data.message||'Check the email and password.');accessToken=data.access_token;staffUserId=data.user.id;sessionStorage.setItem('9jaStaffToken',accessToken);sessionStorage.setItem('9jaStaffUserId',staffUserId);await openAdmin()}catch(error){setMessage('loginMessage',error.message);accessToken='';staffUserId='';sessionStorage.removeItem('9jaStaffToken');sessionStorage.removeItem('9jaStaffUserId')}}
async function openAdmin(){try{const rows=await request('/rest/v1/restaurant_staff?select=user_id,active&user_id=eq.'+encodeURIComponent(staffUserId));if(!rows?.length||!rows[0].active)throw new Error('This account is not on the restaurant staff list. Ask the owner to enable it.');document.querySelector('#loginPanel').classList.add('hidden');document.querySelector('#adminPanel').classList.remove('hidden');await loadItems()}catch(error){document.querySelector('#loginPanel').classList.remove('hidden');document.querySelector('#adminPanel').classList.add('hidden');setMessage('loginMessage',error.message);sessionStorage.removeItem('9jaStaffToken');sessionStorage.removeItem('9jaStaffUserId');accessToken='';staffUserId=''}}
async function logout(){try{await request('/auth/v1/logout',{method:'POST'})}catch(e){}sessionStorage.removeItem('9jaStaffToken');sessionStorage.removeItem('9jaStaffUserId');accessToken='';staffUserId='';document.querySelector('#adminPanel').classList.add('hidden');document.querySelector('#loginPanel').classList.remove('hidden');document.querySelector('#password').value=''}
async function loadItems(){document.querySelector('#menuList').textContent='Loading menu…';try{menuItems=await request('/rest/v1/menu_items?select=slug,name,description,category,price_ngn,tag,image_url,active&order=created_at.desc');renderItems()}catch(error){document.querySelector('#menuList').textContent=error.message}}
function renderItems(){const el=document.querySelector('#menuList');if(!menuItems.length){el.textContent='No menu items found.';return}el.innerHTML=menuItems.map(item=>'<div class="staff-item"><img src="'+esc(item.image_url)+'" alt=""><div><strong>'+esc(item.name)+(item.active?'':' · Hidden')+'</strong><small>'+esc(item.category)+' · ₦'+Number(item.price_ngn).toLocaleString('en-NG')+'</small></div><div class="actions"><button class="secondary" data-action="edit" data-slug="'+esc(item.slug)+'">Edit</button><button class="secondary" data-action="toggle" data-slug="'+esc(item.slug)+'">'+(item.active?'Hide':'Show')+'</button></div></div>').join('')}
function slugify(value){return value.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')}
function resetForm(){editingSlug='';document.querySelector('#itemForm').reset();document.querySelector('#itemActive').checked=true;document.querySelector('#formTitle').textContent='Add a menu item';document.querySelector('#saveButton').textContent='Save item';setMessage('formMessage','')}
async function uploadPhoto(file,slug){if(!file)return '';if(!['image/jpeg','image/png','image/webp'].includes(file.type))throw new Error('Choose a JPG, PNG or WebP image.');if(file.size>5*1024*1024)throw new Error('The photo must be smaller than 5 MB.');const ext=file.type==='image/jpeg'?'jpg':file.type.split('/')[1],path=slug+'/'+crypto.randomUUID()+'.'+ext;const response=await fetch(SB_URL+'/storage/v1/object/menu-photos/'+path.split('/').map(encodeURIComponent).join('/'),{method:'POST',headers:{apikey:SB_ANON_KEY,Authorization:'Bearer '+accessToken,'Content-Type':file.type,'x-upsert':'true'},body:file});if(!response.ok){const err=await response.json().catch(()=>null);throw new Error(err?.message||'Photo upload failed. Check the staff account permissions.')}return SB_URL+'/storage/v1/object/public/menu-photos/'+path}
async function saveItem(event){event.preventDefault();const button=document.querySelector('#saveButton');button.disabled=true;setMessage('formMessage','Saving item…');try{const name=document.querySelector('#itemName').value.trim(),slug=editingSlug||slugify(name),file=document.querySelector('#itemPhoto').files[0];if(!slug)throw new Error('Enter a food name with letters or numbers.');let image_url=menuItems.find(x=>x.slug===editingSlug)?.image_url||'';if(file)image_url=await uploadPhoto(file,slug);if(!editingSlug&&!image_url)throw new Error('Upload a photo for the new menu item.');const payload={name,description:document.querySelector('#itemDescription').value.trim(),category:document.querySelector('#itemCategory').value.trim(),price_ngn:Number(document.querySelector('#itemPrice').value),tag:document.querySelector('#itemTag').value.trim()||'Fresh today',image_url,active:document.querySelector('#itemActive').checked};if(editingSlug){await request('/rest/v1/menu_items?slug=eq.'+encodeURIComponent(editingSlug),{method:'PATCH',body:payload})}else{await request('/rest/v1/menu_items',{method:'POST',body:{slug,...payload}})}resetForm();setMessage('formMessage','Menu item saved.',true);await loadItems()}catch(error){setMessage('formMessage',error.message)}finally{button.disabled=false}}
document.querySelector('#menuList').addEventListener('click',async event=>{const button=event.target.closest('button[data-action]');if(!button)return;const item=menuItems.find(row=>row.slug===button.dataset.slug);if(!item)return;if(button.dataset.action==='edit'){editingSlug=item.slug;document.querySelector('#itemName').value=item.name;document.querySelector('#itemDescription').value=item.description||'';document.querySelector('#itemCategory').value=item.category;document.querySelector('#itemPrice').value=item.price_ngn;document.querySelector('#itemTag').value=item.tag||'';document.querySelector('#itemActive').checked=item.active;document.querySelector('#formTitle').textContent='Edit '+item.name;document.querySelector('#saveButton').textContent='Save changes';document.querySelector('#itemForm').scrollIntoView({behavior:'smooth'})}else{button.disabled=true;try{await request('/rest/v1/menu_items?slug=eq.'+encodeURIComponent(item.slug),{method:'PATCH',body:{active:!item.active}});await loadItems()}catch(error){setMessage('formMessage',error.message)}finally{button.disabled=false}}});
if(accessToken&&staffUserId)openAdmin();
</script>
</body>
</html>
